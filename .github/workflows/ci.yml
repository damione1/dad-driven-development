name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_cloudflareAnalyticsToken: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: hugo --minify --gc --cleanDestinationDir
