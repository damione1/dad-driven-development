name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --cleanDestinationDir

      - name: Check generated SEO metadata
        run: python3 scripts/check-seo.py public

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check www redirect behavior
        run: node --test cloudflare/www-redirect/redirect.test.mjs
