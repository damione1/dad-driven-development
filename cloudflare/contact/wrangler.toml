name = "dad-driven-development-contact"
main = "worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = false
preview_urls = false

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAF64lUp5drdxUwVR"

# CONTACT_TO, CONTACT_FROM and TURNSTILE_SECRET_KEY are Worker secrets.
# Addresses are never supplied by the static build or CI.
[[send_email]]
name = "CONTACT_EMAIL"

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "202611092"
simple = { limit = 3, period = 60 }

[[routes]]
pattern = "damiengoehrig.ca/api/contact*"
zone_name = "damiengoehrig.ca"
