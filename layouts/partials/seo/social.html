{{- $page := .page -}}
{{- $meta := .metadata -}}
<meta property="og:url" content="{{ $meta.canonical }}">
<meta property="og:site_name" content="{{ $page.Site.Title }}">
<meta property="og:title" content="{{ $meta.title }}">
<meta property="og:description" content="{{ $meta.description }}">
<meta property="og:locale" content="{{ if eq $page.Lang "fr" }}fr_CA{{ else }}en_CA{{ end }}">
<meta property="og:type" content="{{ if and $page.IsPage (eq $page.Section "blog") }}article{{ else }}website{{ end }}">
<meta name="twitter:title" content="{{ $meta.title }}">
<meta name="twitter:description" content="{{ $meta.description }}">
{{ with $meta.image }}
  <meta property="og:image" content="{{ .Permalink }}">
  <meta property="og:image:width" content="{{ .Width }}">
  <meta property="og:image:height" content="{{ .Height }}">
  <meta property="og:image:alt" content="{{ if and $page.IsPage (eq $page.Section "blog") }}{{ $page.Title }}{{ else }}{{ $page.Site.Params.Author.name }}{{ end }}">
  <meta name="twitter:image" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
{{ else }}
  <meta name="twitter:card" content="summary">
{{ end }}
{{ if and $page.IsPage (eq $page.Section "blog") }}
  <meta property="article:published_time" content="{{ $page.PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
  <meta property="article:modified_time" content="{{ $page.Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ end }}
